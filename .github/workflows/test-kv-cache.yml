name: Print cache env

on:
  workflow_dispatch:   # run manually from the Actions tab
  push:                # or on push, so it runs on the same runner as the failing job

jobs:
  print-cache-env:
    runs-on:
      group: Bitrise-M4Pro  # <-- must be the Bitrise-forked runner; a GitHub-hosted runner points these at GitHub, not the Bitrise proxy
    steps:
      - name: Print ACTIONS_RESULTS_URL (and related cache env)
        run: |
          echo "ACTIONS_RESULTS_URL          = ${ACTIONS_RESULTS_URL:-<unset>}"
          echo "ACTIONS_RESULTS_URL_ORIGINAL = ${ACTIONS_RESULTS_URL_ORIGINAL:-<unset>}"
          echo "ACTIONS_CACHE_URL            = ${ACTIONS_CACHE_URL:-<unset>}"
          echo "ACTIONS_CACHE_URL_ORIGINAL   = ${ACTIONS_CACHE_URL_ORIGINAL:-<unset>}"
          echo "ACTIONS_CACHE_SERVICE_V2     = ${ACTIONS_CACHE_SERVICE_V2:-<unset>}"
          echo "ACTIONS_RUNTIME_TOKEN set?   = $([ -n "$ACTIONS_RUNTIME_TOKEN" ] && echo yes || echo no)"

      - name: Check cache-proxy token expiry
        run: sudo plutil -extract EnvironmentVariables.BITRISEIO_BITRISE_SERVICES_ACCESS_TOKEN raw /Library/LaunchDaemons/github-cache-proxy.plist | python3 -c 'import sys,base64,json,time;p=sys.stdin.read().strip().split(".")[1];p+="="*(-len(p)%4);e=json.loads(base64.urlsafe_b64decode(p))["exp"];print("expires",time.strftime("%Y-%m-%d %H:%M:%S UTC",time.gmtime(e)),"| expired?",e<time.time())'
